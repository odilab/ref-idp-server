name: Init SSH Connection
description: >-
  Install a base64 deploy key, pin the host key via ssh-keyscan, write an
  ~/.ssh/config alias and start an ssh-agent. Outputs the agent socket so
  later steps can use DOCKER_HOST=ssh://<hostvar>.
author: odilab
inputs:
  hostvar:
    required: true
    description: "ssh_config Host alias to define (use it as DOCKER_HOST=ssh://<alias>); not resolved via DNS"
  username:
    required: true
    description: "The SSH Username (odilab on the erp-service-dev fleet); no default, an empty value fails validation"
  port:
    required: true
    description: "The SSH Port (2222 on the erp-service-dev fleet); no default, an empty value fails validation"
  server_ip:
    required: true
    description: "The SSH Server IP"
  ssh_key:
    required: true
    description: "Base64 String SSH Key to use for the server ssh connection"
outputs:
  ssh_auth_sock:
    description: "The SSH_AUTH_SOCK"
    value: ${{ steps.ssh-agent.outputs.ssh_auth_sock }}
  ssh_url:
    description: "The SSH URL"
    value: ${{ steps.ssh-agent.outputs.ssh_url }}
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    # Composite actions do not enforce `required: true`, and an unset secret
    # or repo variable expands to "". Fail here with a named cause instead of
    # skipping silently and letting a later docker/ssh step fail opaquely.
    - name: Validate inputs
      shell: bash
      env:
        HOSTVAR: ${{ inputs.hostvar }}
        SSH_USER: ${{ inputs.username }}
        SSH_PORT: ${{ inputs.port }}
        SERVER_IP: ${{ inputs.server_ip }}
        SSH_KEY: ${{ inputs.ssh_key }}
      run: |
        fail=0
        [ -n "$HOSTVAR" ] || { echo "::error::ssh-connect: input 'hostvar' is empty - is the SSH_HOST repo variable set?"; fail=1; }
        [ -n "$SSH_USER" ] || { echo "::error::ssh-connect: input 'username' is empty - is the SSH_USER repo variable set?"; fail=1; }
        [ -n "$SSH_PORT" ] || { echo "::error::ssh-connect: input 'port' is empty - is the SSH_PORT repo variable set?"; fail=1; }
        [ -n "$SERVER_IP" ] || { echo "::error::ssh-connect: input 'server_ip' is empty - is the SERVER_IP repo variable set?"; fail=1; }
        [ -n "$SSH_KEY" ] || { echo "::error::ssh-connect: input 'ssh_key' is empty - is the DEPLOYMENT_KEY secret set?"; fail=1; }
        exit "$fail"
    # Inputs reach the shell only via env; nothing is ${{ }}-interpolated into
    # script text, so a crafted or multi-line value cannot become shell code.
    # The key path is set in-script from $HOME because a quoted "$VAR" does
    # not tilde-expand.
    - name: Init deploy key
      id: ssh_keys
      env:
        PRIVATE_KEY: ${{ inputs.ssh_key }}
      shell: bash
      run: |
        PRIVATE_KEY_PATH="$HOME/.ssh/id_deploy"
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s' "$PRIVATE_KEY" | base64 -d > "$PRIVATE_KEY_PATH" \
          || { echo "::error::ssh-connect: ssh_key does not decode as base64"; exit 1; }
        chmod 600 "$PRIVATE_KEY_PATH"
        ssh-keygen -f "$PRIVATE_KEY_PATH" -y > "$PRIVATE_KEY_PATH.pub" \
          || { echo "::error::ssh-connect: decoded ssh_key is not a usable private key"; exit 1; }
        chmod 644 "$PRIVATE_KEY_PATH.pub"
    - name: Write SSH config
      id: write-ssh-config
      shell: bash
      env:
        SSH_USER: ${{ inputs.username }}
        SSH_PORT: ${{ inputs.port }}
        SERVER_IP: ${{ inputs.server_ip }}
        HOSTVAR: ${{ inputs.hostvar }}
      run: |
        PRIVATE_KEY_PATH="$HOME/.ssh/id_deploy"
        # Older ssh-keyscan exits 0 even when it reaches nothing, so check the
        # output too; an empty known_hosts would only surface later as an
        # opaque "Host key verification failed".
        ssh-keyscan -p "$SSH_PORT" "$SERVER_IP" > "$RUNNER_TEMP/keyscan" \
          || { echo "::error::ssh-connect: ssh-keyscan failed for $SERVER_IP:$SSH_PORT - host unreachable or no sshd listening"; exit 1; }
        [ -s "$RUNNER_TEMP/keyscan" ] \
          || { echo "::error::ssh-connect: ssh-keyscan returned no host keys for $SERVER_IP:$SSH_PORT"; exit 1; }
        cat "$RUNNER_TEMP/keyscan" >> ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
        echo "Host $HOSTVAR" > ~/.ssh/config
        echo "  HostName $SERVER_IP" >> ~/.ssh/config
        echo "  User $SSH_USER" >> ~/.ssh/config
        echo "  Port $SSH_PORT" >> ~/.ssh/config
        echo "  IdentityFile $PRIVATE_KEY_PATH" >> ~/.ssh/config
    - name: Eval Agent
      id: ssh-agent
      shell: bash
      env:
        SSH_USER: ${{ inputs.username }}
        HOSTVAR: ${{ inputs.hostvar }}
      run: |
        PRIVATE_KEY_PATH="$HOME/.ssh/id_deploy"
        eval "$(ssh-agent -s)"
        export SSH_AUTH_SOCK
        ssh-add "$PRIVATE_KEY_PATH"
        echo "ssh_auth_sock=$SSH_AUTH_SOCK" >> "$GITHUB_OUTPUT"
        echo "ssh_url=ssh://$SSH_USER@$HOSTVAR" >> "$GITHUB_OUTPUT"
