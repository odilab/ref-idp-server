name: Init SSH Connection
description: >-
  Install a base64 deploy key, pin the host key via ssh-keyscan, write an
  ~/.ssh/config alias and start an ssh-agent. Outputs the agent socket so
  later steps can use DOCKER_HOST=ssh://<hostvar>.
author: odilab
inputs:
  hostvar:
    required: true
    description: "ssh_config Host alias to define (use it as DOCKER_HOST=ssh://<alias>); not resolved via DNS"
  username:
    required: false
    description: "The SSH Username (odilab on the erp-service-dev fleet; the root default suits no odilab host)"
    default: "root"
  port:
    required: false
    description: "The SSH Port (2222 on the erp-service-dev fleet; the 22 default suits no odilab host)"
    default: "22"
  server_ip:
    required: true
    description: "The SSH Server IP"
  ssh_key:
    required: true
    description: "Base64 String SSH Key to use for the server ssh connection"
outputs:
  ssh_auth_sock:
    description: "The SSH_AUTH_SOCK"
    value: ${{ steps.ssh-agent.outputs.ssh_auth_sock }}
  ssh_url:
    description: "The SSH URL"
    value: ${{ steps.ssh-agent.outputs.ssh_url }}
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    # Inputs reach the shell only via env; nothing is ${{ }}-interpolated into
    # script text, so a crafted or multi-line value cannot become shell code.
    # The key path is set in-script from $HOME because a quoted "$VAR" does
    # not tilde-expand.
    - name: Init deploy key
      id: ssh_keys
      if: ${{ inputs.ssh_key }}
      env:
        PRIVATE_KEY: ${{ inputs.ssh_key }}
      shell: bash
      run: |
        PRIVATE_KEY_PATH="$HOME/.ssh/id_deploy"
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s' "$PRIVATE_KEY" | base64 -d > "$PRIVATE_KEY_PATH" && chmod 600 "$PRIVATE_KEY_PATH"
        ssh-keygen -f "$PRIVATE_KEY_PATH" -y > "$PRIVATE_KEY_PATH.pub" && chmod 644 "$PRIVATE_KEY_PATH.pub"
    - name: Write SSH config
      id: write-ssh-config
      if: ${{ inputs.ssh_key }}
      shell: bash
      env:
        SSH_USER: ${{ inputs.username }}
        SSH_PORT: ${{ inputs.port }}
        SERVER_IP: ${{ inputs.server_ip }}
        HOSTVAR: ${{ inputs.hostvar }}
      run: |
        PRIVATE_KEY_PATH="$HOME/.ssh/id_deploy"
        ssh-keyscan -p "$SSH_PORT" "$SERVER_IP" >> ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
        echo "Host $HOSTVAR" > ~/.ssh/config
        echo "  HostName $SERVER_IP" >> ~/.ssh/config
        echo "  User $SSH_USER" >> ~/.ssh/config
        echo "  Port $SSH_PORT" >> ~/.ssh/config
        echo "  IdentityFile $PRIVATE_KEY_PATH" >> ~/.ssh/config
    - name: Eval Agent
      if: ${{ inputs.ssh_key }}
      id: ssh-agent
      shell: bash
      env:
        SSH_USER: ${{ inputs.username }}
        HOSTVAR: ${{ inputs.hostvar }}
      run: |
        PRIVATE_KEY_PATH="$HOME/.ssh/id_deploy"
        eval "$(ssh-agent -s)"
        export SSH_AUTH_SOCK
        ssh-add "$PRIVATE_KEY_PATH"
        echo "ssh_auth_sock=$SSH_AUTH_SOCK" >> "$GITHUB_OUTPUT"
        echo "ssh_url=ssh://$SSH_USER@$HOSTVAR" >> "$GITHUB_OUTPUT"
