name: Build idp-server Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_call:
    outputs:
      commit_tag:
        description: "Short commit SHA tag for the image"
        value: ${{ jobs.bootBuildImage.outputs.commit_tag }}
      image:
        description: "Full image reference for this commit"
        value: ${{ jobs.bootBuildImage.outputs.image }}

jobs:
  bootBuildImage:
    if: ${{ github.actor != 'dependabot[bot]' }}
    # Serialisiert Läufe je Ref; auf main gewinnt der neueste Merge,
    # damit :latest nie auf einen älteren Stand zurückfällt.
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      commit_tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Login ghcr.io
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      # Baut nur das Jar; skip.dockerbuild bleibt auf seinem Default true,
      # das Image entsteht unten via buildx aus .github/docker/Dockerfile.
      - name: Build Jar
        run: mvn clean package -pl idp-server -am -Dskip.unittests -Dskip.inttests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute tags and platforms
        id: meta
        run: |
          COMMIT_TAG=$(git rev-parse --short HEAD)
          IMAGE_REPO="ghcr.io/${{ github.repository }}"
          TAG_ARGS="--tag ${IMAGE_REPO}:${COMMIT_TAG}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG_ARGS="${TAG_ARGS} --tag ${IMAGE_REPO}:pr-${{ github.event.pull_request.number }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_ARGS="${TAG_ARGS} --tag ${IMAGE_REPO}:test"
          fi
          # main ist protected — ein Push dorthin ist immer ein PR-Merge.
          # Nur dort wird multi-arch gebaut; Dev-Builds bleiben amd64-only.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG_ARGS="${TAG_ARGS} --tag ${IMAGE_REPO}:latest"
            VERSION=$(basename idp-server/target/idp-server-*.jar .jar | sed 's/^idp-server-//')
            TAG_ARGS="${TAG_ARGS} --tag ${IMAGE_REPO}:${VERSION}"
            PLATFORMS="linux/amd64,linux/arm64"
          else
            PLATFORMS="linux/amd64"
          fi
          echo "tag=${COMMIT_TAG}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE_REPO}:${COMMIT_TAG}" >> $GITHUB_OUTPUT
          echo "tag_args=${TAG_ARGS}" >> $GITHUB_OUTPUT
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
      - name: Build and push image
        run: >-
          docker buildx build
          --push
          --platform ${{ steps.meta.outputs.platforms }}
          --file .github/docker/Dockerfile
          --build-arg COMMIT_HASH=${{ github.sha }}
          --build-arg VERSION=${{ steps.meta.outputs.tag }}
          ${{ steps.meta.outputs.tag_args }}
          idp-server/target
