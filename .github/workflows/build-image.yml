name: Build idp-server Image
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      commit_tag:
        description: "Short commit SHA tag for the image"
        value: ${{ jobs.bootBuildImage.outputs.commit_tag }}
      image:
        description: "Full image reference for this commit"
        value: ${{ jobs.bootBuildImage.outputs.image }}

jobs:
  bootBuildImage:
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    outputs:
      commit_tag: ${{ steps.commit-tag.outputs.tag }}
      image: ${{ steps.commit-tag.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Login ghcr.io
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build Image
        run: mvn clean package -pl idp-server -am -Dskip.unittests -Dskip.inttests -Dskip.dockerbuild=false
      - name: Tag commit
        id: commit-tag
        run: |
          COMMIT_TAG=$(git rev-parse --short HEAD)
          IMAGE_REPO="ghcr.io/${{ github.repository }}"
          docker tag local/idm/idp-server:latest ${IMAGE_REPO}:${COMMIT_TAG}
          echo "tag=${COMMIT_TAG}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE_REPO}:${COMMIT_TAG}" >> $GITHUB_OUTPUT
      - name: Tag image with PR number
        if: github.event_name == 'pull_request'
        run: docker tag local/idm/idp-server:latest ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
      - name: Tag image as test for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: docker tag local/idm/idp-server:latest ghcr.io/${{ github.repository }}:test
      - name: Tag version release
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker tag local/idm/idp-server:latest ghcr.io/${{ github.repository }}:${GITHUB_REF#refs/tags/}
      - name: Push tag to ghcr.io
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: docker push --all-tags ghcr.io/${{ github.repository }}
