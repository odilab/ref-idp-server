name: DEV Deploy IDP
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
  deploy:
    if: ${{ github.actor != 'dependabot[bot]'}}
    needs: [ build ]
    environment:
      name: dev
      url: https://dev-idp.optadata-innovationlab.de/swagger-ui/index.html
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.SSH_HOST || 'erp-service-dev' }}
      SSH_USER: ${{ vars.SSH_USER || 'odilab' }}
      SSH_PORT: ${{ vars.SSH_PORT || '2222' }}
    steps:
      - uses: actions/checkout@v6
      - name: Login ghcr.io
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/ssh-connect
        id: ssh-connect
        with:
          hostvar: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          port: ${{ env.SSH_PORT }}
          server_ip: ${{ vars.SERVER_IP }}
          ssh_key: ${{ secrets.DEPLOYMENT_KEY }}
      - name: Deploy IDP-Server
        id: deploy-compose
        env:
          SSH_AUTH_SOCK: ${{ steps.ssh-connect.outputs.ssh_auth_sock }}
          DOCKER_HOST: ssh://${{ env.SSH_HOST }}
          COMPOSE_FILE: docker-compose-dev.yml
          COMPOSE_PROFILES: dev
          IDP_SERVER_IMAGE: ${{ needs.build.outputs.image }}
          IDP_IDPSIG_FILENAME: file:/credentials/idp_sig.p12
          IDP_IDPENC_FILENAME: file:/credentials/idp_enc.p12
          IDP_DISCSIG_FILENAME: file:/credentials/disc_sig.p12
          # Named external volume (NOT a path): seeded by the
          # odilab/erp-credentials stack, mounted read-only at /credentials.
          CREDENTIALS_SOURCE: erp-credentials
          IDP_SERVER_URL: https://dev-idp.optadata-innovationlab.de
        run: |
          # No `down`: it would run with COMPOSE_PROFILES=dev and stop the SHARED
          # Traefik, and it would try to remove the idp-reference network that the
          # erp-services and erp-fd stacks reference as external. `up -d`
          # recreates idp-server on its own, because the image tag changed.
          # --remove-orphans prunes only services absent from this file, so the
          # shared proxy survives — until someone removes or renames it here.
          docker pull ${{ env.IDP_SERVER_IMAGE }}
          IDP_SERVER_IMAGE=${{ env.IDP_SERVER_IMAGE }} \
          docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans
      # The upstream Dockerfile runs the server as uid 10000, so the p12s in
      # the shared volume must be world-readable. Re-seeding erp-credentials
      # has broken this before; fail the deploy here rather than on p12 load.
      - name: Verify uid 10000 can read credentials
        env:
          SSH_AUTH_SOCK: ${{ steps.ssh-connect.outputs.ssh_auth_sock }}
          DOCKER_HOST: ssh://${{ env.SSH_HOST }}
        run: |
          docker run --rm -u 10000:10000 -v erp-credentials:/credentials:ro alpine:3.20 \
            sh -c 'id -u && cat /credentials/idp_sig.p12 /credentials/idp_enc.p12 /credentials/disc_sig.p12 > /dev/null && echo credentials readable'
