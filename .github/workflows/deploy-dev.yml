name: DEV Deploy IDP
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
  deploy:
    if: ${{ github.actor != 'dependabot[bot]'}}
    needs: [ build ]
    environment:
      name: dev
      url: https://dev-idp.optadata-innovationlab.de/swagger-ui/index.html
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Login ghcr.io
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/ssh-connect
        id: ssh-connect
        with:
          hostvar: erp-service-dev
          server_ip: ${{ vars.SERVER_IP }}
          ssh_key: ${{ secrets.DEPLOYMENT_KEY }}
      - name: Deploy IDP-Server
        id: deploy-compose
        env:
          SSH_AUTH_SOCK: ${{ steps.ssh-connect.outputs.ssh_auth_sock }}
          DOCKER_HOST: ssh://root@${{ vars.SERVER_IP }}
          COMPOSE_FILE: docker-compose-dev.yml
          COMPOSE_PROFILES: dev
          IDP_SERVER_IMAGE: ${{ needs.build.outputs.image }}
          IDP_IDPSIG_FILENAME: file:/credentials/idp_sig.p12
          IDP_IDPENC_FILENAME: file:/credentials/idp_enc.p12
          IDP_DISCSIGG_FILENAME: file:/credentials/disc_sig.p12
          IDP_SERVER_URL: https://dev-idp.optadata-innovationlab.de
        run: |
          docker pull ${{ env.IDP_SERVER_IMAGE }}
          docker compose -f ${{ env.COMPOSE_FILE }} down
          IDP_SERVER_IMAGE=${{ env.IDP_SERVER_IMAGE }} \
          docker compose -f ${{ env.COMPOSE_FILE }} up -d